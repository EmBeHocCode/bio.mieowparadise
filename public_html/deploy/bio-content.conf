# Shared by the initial HTTP vhost and the final HTTPS vhost.
root /var/www/bio.mieowparadise.io.vn/public_html;
index index.html;
charset utf-8;
autoindex off;
server_tokens off;
access_log /var/log/nginx/bio-access.log;
error_log /var/log/nginx/bio-error.log;
add_header X-Content-Type-Options nosniff always;
gzip_types text/css application/javascript application/json image/svg+xml;

location / {
    try_files $uri $uri/ =404;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

location = /js/music-library.js {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options nosniff always;
}

location = /api/lyrics {
    # Retired AI endpoint: older cached clients must not enqueue recognition.
    default_type application/json;
    return 410 '{"status":"retired","lines":[]}';
}

location ~* ^/assets/music/.*\.lrc$ {
    default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}

# Preserve automatic discovery when a new cover is copied into cover-png.
location = /assets/cover-png/ {
    rewrite ^ /assets/cover-png/index.php last;
}

location = /assets/cover-png/index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_hide_header X-Powered-By;
}

location ~ \.php(?:/|$) {
    return 404;
}

location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}

location ~* \.(?:css|js|png|jpe?g|gif|webp|avif|ico|svg|cur|mp3|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

server {
    listen 80;
    listen [::]:80;
    server_name bio.mieowparadise.io.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://bio.mieowparadise.io.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bio.mieowparadise.io.vn;

    ssl_certificate /etc/letsencrypt/live/bio.mieowparadise.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bio.mieowparadise.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/bio-content.conf;
}

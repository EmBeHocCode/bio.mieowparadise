<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05020c" />
    <title>Meow Astral Core</title>
    <script type="module" crossorigin src="./assets/index-C6q1CCic.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CpqYB6V6.css">
    <style>
      :root {
        --accent-color: #ff0066;
        --accent-rgb: 255, 0, 102;
        --accent-hue-shift: 0deg;
      }

      html, body {
        background: #05020c;
      }

      .hero-copy { display: none !important; }
      .intro-veil { display: none !important; }
      .scene-settings { display: none !important; }

      #root {
        filter: hue-rotate(var(--accent-hue-shift)) saturate(1.08) brightness(1.03);
      }

      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 52%, rgba(var(--accent-rgb), 0.22), transparent 46%),
          radial-gradient(circle at 48% 56%, rgba(var(--accent-rgb), 0.12), transparent 66%);
        mix-blend-mode: screen;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      function normalizeAccentHex(raw) {
        var clean = String(raw || '').trim().replace(/^#/, '');
        return /^[0-9a-fA-F]{6}$/.test(clean) ? ('#' + clean.toLowerCase()) : null;
      }

      function hexToRgb(hex) {
        var normalized = normalizeAccentHex(hex) || '#ff0066';
        return {
          r: parseInt(normalized.slice(1, 3), 16),
          g: parseInt(normalized.slice(3, 5), 16),
          b: parseInt(normalized.slice(5, 7), 16),
        };
      }

      function hueFromHex(hex) {
        var rgb = hexToRgb(hex);
        var r = rgb.r / 255;
        var g = rgb.g / 255;
        var b = rgb.b / 255;
        var max = Math.max(r, g, b);
        var min = Math.min(r, g, b);
        var d = max - min;
        if (d === 0) return 0;
        var hue;
        if (max === r) hue = ((g - b) / d) % 6;
        else if (max === g) hue = (b - r) / d + 2;
        else hue = (r - g) / d + 4;
        hue = hue * 60;
        return hue < 0 ? hue + 360 : hue;
      }

      function applyAccentTheme(hex) {
        var normalized = normalizeAccentHex(hex) || '#ff0066';
        var rgb = hexToRgb(normalized);
        var baseHue = 336; // base hue of #ff0066 scene
        var targetHue = hueFromHex(normalized);
        var shift = targetHue - baseHue;

        document.documentElement.style.setProperty('--accent-color', normalized);
        document.documentElement.style.setProperty('--accent-rgb', rgb.r + ', ' + rgb.g + ', ' + rgb.b);
        document.documentElement.style.setProperty('--accent-hue-shift', shift.toFixed(2) + 'deg');
      }

      (function syncAccentFromQuery() {
        var params = new URLSearchParams(window.location.search);
        var accent = params.get('accent');
        if (accent) applyAccentTheme('#' + accent);
      })();

      // Receive forwarded pointer events from the parent page. The iframe stays
      // pointer-events:none so the bio UI remains clickable, while React Three
      // still receives canvas-style pointer input.
      window.addEventListener('message', function(e) {
        var data = e.data || {};
        if (data.type === 'parent-accent') {
          applyAccentTheme('#' + String(data.accent || ''));
          return;
        }
        if (data.type !== 'parent-pointer' && data.type !== 'parent-mousemove') return;

        var x = Math.min(window.innerWidth, Math.max(0, Number(data.nx || 0) * window.innerWidth));
        var y = Math.min(window.innerHeight, Math.max(0, Number(data.ny || 0) * window.innerHeight));
        var eventType = data.eventType || 'pointermove';
        var target = document.elementFromPoint(x, y) || document.querySelector('canvas') || document.body;
        var common = {
          bubbles: true,
          cancelable: true,
          composed: true,
          clientX: x,
          clientY: y,
          screenX: x,
          screenY: y,
          button: typeof data.button === 'number' ? data.button : -1,
          buttons: typeof data.buttons === 'number' ? data.buttons : 0,
          altKey: Boolean(data.altKey),
          ctrlKey: Boolean(data.ctrlKey),
          metaKey: Boolean(data.metaKey),
          shiftKey: Boolean(data.shiftKey)
        };

        var pointerEvent;
        if (typeof PointerEvent === 'function') {
          pointerEvent = new PointerEvent(eventType, Object.assign({}, common, {
            pointerId: 1,
            pointerType: 'mouse',
            isPrimary: true
          }));
          target.dispatchEvent(pointerEvent);
          document.dispatchEvent(new PointerEvent(eventType, Object.assign({}, common, {
            bubbles: false,
            pointerId: 1,
            pointerType: 'mouse',
            isPrimary: true
          })));
          window.dispatchEvent(new PointerEvent(eventType, Object.assign({}, common, {
            bubbles: false,
            pointerId: 1,
            pointerType: 'mouse',
            isPrimary: true
          })));
        }

        if (eventType === 'pointermove') {
          target.dispatchEvent(new MouseEvent('mousemove', common));
          document.dispatchEvent(new MouseEvent('mousemove', Object.assign({}, common, { bubbles: false })));
          window.dispatchEvent(new MouseEvent('mousemove', Object.assign({}, common, { bubbles: false })));
        }
      });
    </script>
  </body>
</html>
